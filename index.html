  const rg = rng(regionId.length * 1009 + regionId.charCodeAt(0) * 31);
  const [gc, g] = mk(WW, WH), r = R(g);
  const mask = new Uint8Array(WW * WH);
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) mask[y * WW + x] = inIsle(x, y, 0) ? 1 : 0;
  const m = (x, y) => (x < 0 || y < 0 || x >= WW || y >= WH) ? 0 : mask[y * WW + x];
  const id = g.createImageData(WW, WH), d = id.data, gcol = T.g.map(hex), rim = hex(T.rim), cl = T.cliff.map(hex), dark = hex('#16081f');
  const put = (x, y, c) => { const i = (y * WW + x) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255; };
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    if (!mask[y * WW + x]) continue;
    const n = hash2(x, y), lf = Math.sin(x * 0.045) + Math.sin(y * 0.06 + 1) + Math.sin((x + y) * 0.025 + 2);
    let ci = n < 0.05 ? 3 : n < 0.18 ? 2 : (lf > 0.9 && n < 0.7) ? 1 : 0;
    if (th === 'ruins' && ((x + (((y / 16) | 0) & 1) * 8) % 16 === 0 || y % 16 === 0) && lf > -0.4) ci = 2;
    if (th === 'frost' && ((x * 3 + y * 2) % 29 === 0 || (x - y * 2 + 700) % 41 === 0)) ci = 3;
    put(x, y, gcol[ci]);
    if (!m(x - 1, y) || !m(x + 1, y) || !m(x, y - 1)) put(x, y, rim); else if (!m(x, y + 1)) put(x, y, dark);
  }
  for (let x = 0; x < WW; x++) {
    let b = -1; for (let y = WH - 1; y >= 0; y--) if (mask[y * WW + x]) { b = y; break; } if (b < 0) continue;
    const nx = Math.abs((x - ISLE.cx) / ISLE.rx), depth = Math.round(8 + 34 * (1 - Math.pow(Math.min(1, nx), 2.2)) + Math.sin(x * 0.21) * 4 + hash2(x >> 1, 7) * 6);
    for (let k = 1; k <= depth && b + k < WH; k++) {
      const f = k / depth; let c = f < 0.22 ? cl[0] : f < 0.65 ? cl[1] : cl[2];
      if (hash2(x >> 1, k >> 2) < 0.16) c = dark; if (k === depth) c = dark; put(x, b + k, c);
    }
  }
  g.putImageData(id, 0, 0);
  const cx = ISLE.cx, cy = ISLE.cy;
  for (let y = -36; y <= 36; y++) for (let x = -54; x <= 54; x++) {
    const e = (x / 52) ** 2 + (y / 34) ** 2; if (e > 1) continue;
    const tile = ((x + 60) % 12 === 0) || ((y + 40 + (((x + 60) / 12 | 0) & 1) * 6) % 12 === 0);
    g.fillStyle = e > 0.88 ? T.stone[3] : tile ? T.stone[2] : (hash2(x + 99, y + 9) < 0.2 ? T.stone[0] : T.stone[1]); g.fillRect(cx + x, cy + y, 1, 1);
  }
  g.fillStyle = T.glow; for (let a = 0; a < TAU; a += TAU / 16) r(Math.round(cx + Math.cos(a) * 40), Math.round(cy + Math.sin(a) * 26), 2, 2, T.glow);
  for (let a = 0; a < TAU; a += 0.06) g.fillRect(Math.round(cx + Math.cos(a) * 22), Math.round(cy + Math.sin(a) * 14), 1, 1);
  r(cx - 1, cy - 14, 2, 28, T.glow); r(cx - 22, cy - 1, 44, 2, T.glow); disc(g, cx, cy, 3, T.stone[0]);
  const free = (x, y) => inIsle(x, y, 8) && ((x - cx) / 58) ** 2 + ((y - cy) / 40) ** 2 > 1;
  for (let i = 0; i < 380; i++) {
    const x = ri(40, WW - 40), y = ri(40, WH - 80); if (!free(x, y)) continue; const k = rg();
    if (k < 0.45) { const c = T.leaf[ri(0, 2)]; r(x, y, 1, 2, c); r(x + 2, y + 1, 1, 2, c); r(x - 1, y + 1, 1, 1, c); }
    else if (k < 0.7) r(x, y, 3, 2, T.stone[ri(1, 2)]);
    else if (k < 0.85) { r(x, y, 1, 3, T.leaf[2]); r(x - 1, y - 1, 3, 1, T.glow); }
    else { let px = x, py = y; for (let j = 0; j < ri(5, 12); j++) { r(px, py, 1, 1, th === 'ember' ? T.glow : T.g[2]); px += ri(-1, 1) + 1; py += ri(0, 1); } }
  }
  const rects = [], circs = [], objs = [], canopies = [], pools = [], crystals = [], placed = [];
  for (let n = 0, tries = 0; n < 2 && tries < 100; tries++) {
    const x = ri(120, WW - 120), y = ri(110, WH - 150); if (!inIsle(x, y, 44) || ((x - cx) / 90) ** 2 + ((y - cy) / 60) ** 2 < 1) continue;
    if (pools.some(p => dist(p.x, p.y, x, y) < 120)) continue; n++; pools.push({ x, y });
    for (let yy = -13; yy <= 13; yy++) for (let xx = -26; xx <= 26; xx++) { const e = (xx / 24) ** 2 + (yy / 12) ** 2; if (e > 1.12) continue; g.fillStyle = e > 1 ? T.stone[2] : e > 0.78 ? T.pool[0] : e > 0.35 ? T.pool[1] : T.pool[0]; g.fillRect(x + xx, y + yy, 1, 1); }
    for (let k = 0; k < 6; k++) r(x - 12 + k * 4 + ri(-1, 1), y - 3 + (k % 3) * 3, 3, 1, T.pool[2]);
    circs.push({ x: x - 10, y: y, r: 10 }, { x: x + 10, y: y, r: 10 }, { x: x, y: y, r: 9 }); placed.push({ x, y, s: 26 });
  }
  const W8 = { ruins: { pillar: 10, wall: 6, tree: 9, crystal: 7, rock: 5 }, ember: { rock: 10, tree: 9, crystal: 8, pillar: 4, wall: 3 }, frost: { crystal: 11, tree: 10, rock: 6, pillar: 4, wall: 3 } }[th];
  const bag = []; for (const k in W8) for (let i = 0; i < W8[k]; i++) bag.push(k);
  for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rg() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  const SZ = { pillar: 12, wall: 22, rock: 13, crystal: 11, tree: 11 };
  for (const kind of bag) {
    for (let t = 0; t < 80; t++) {
      const x = ri(60, WW - 60), y = ri(70, WH - 100), s = SZ[kind];
      if (!inIsle(x, y, 22 + s) || ((x - cx) / 80) ** 2 + ((y - cy) / 56) ** 2 < 1) continue;
      if (placed.some(p => dist(p.x, p.y, x, y) < p.s + s + 14)) continue;
      const v = (placed.length % 3) + 1; placed.push({ x, y, s });
      if (kind === 'pillar') { const spr = cached('pi' + th + v, () => stoneSprite(th, 'pillar', v)); rects.push({ x: x - 6, y: y - 6, w: 12, h: 6 }); objs.push({ y, x, spr, ox: -9, oy: -38 }); }
      else if (kind === 'wall') { const spr = cached('wa' + th + v, () => stoneSprite(th, 'wall', v)); rects.push({ x: x - 18, y: y - 7, w: 36, h: 7 }); objs.push({ y, x, spr, ox: -20, oy: -22 }); }
      else if (kind === 'rock') { const spr = cached('ro' + th + v, () => stoneSprite(th, 'rock', v)); rects.push({ x: x - 10, y: y - 8, w: 20, h: 8 }); objs.push({ y, x, spr, ox: -13, oy: -17 }); }
      else if (kind === 'crystal') { const spr = cached('cr' + th + v, () => stoneSprite(th, 'crystal', v)); rects.push({ x: x - 6, y: y - 7, w: 12, h: 7 }); objs.push({ y, x, spr, ox: -13, oy: -32 }); crystals.push({ x, y: y - 28 }); }
      else { const ts = cached('tr' + th + v, () => treeSprites(th, v)); rects.push({ x: x - 4, y: y - 5, w: 8, h: 5 }); objs.push({ y, x, spr: ts.trunk, ox: -7, oy: -24 }); canopies.push({ x, y, spr: ts.canopy, ox: -26, oy: -62, bx: x - 26, by: y - 62, bw: 52, bh: 38 }); }
      break;
    }
  }
  const [mini, mg] = mk(56, 38); for (let y = 0; y < 38; y++) for (let x = 0; x < 56; x++) if (inIsle(x / 56 * WW, y / 38 * WH, 0)) { mg.fillStyle = T.g[1]; mg.fillRect(x, y, 1, 1); }
  for (const o of rects) { mg.fillStyle = T.stone[2]; mg.fillRect(Math.round((o.x + o.w / 2) / WW * 56), Math.round((o.y + o.h / 2) / WH * 38), 1, 1); }
  for (const p of pools) { mg.fillStyle = T.pool[2]; mg.fillRect(Math.round(p.x / WW * 56) - 1, Math.round(p.y / WH * 38), 3, 1); }
  objs.sort((a, b) => a.y - b.y);
  const bg = { sky: makeSky(th), isles: [], clouds: [], near: [], fgLeaves: [] };
  for (let i = 0; i < 6; i++) bg.isles.push({ x: i * 150 + rg() * 60, y: 40 + rg() * 90, f: 0.06 + rg() * 0.08, spr: cached('fi' + th + i, () => makeFloatIsle(th, i)), ph: rg() * 6 });
  for (let i = 0; i < 5; i++) bg.clouds.push({ x: i * 190, y: 20 + rg() * 200, f: 0.12 + rg() * 0.1, sp: 4 + rg() * 6, spr: cached('cl' + th + i, () => makeCloud(th, 120 + (i % 3) * 30, i)) });
  for (let i = 0; i < 3; i++) bg.near.push({ x: i * 330 + 40, y: 200 + rg() * 60, f: 0.35, spr: cached('fi2' + th + i, () => makeFloatIsle(th, i + 3)), ph: rg() * 6 });
  for (let i = 0; i < 9; i++) bg.fgLeaves.push({ x: i * 150 + rg() * 60, top: i % 3 !== 2, spr: cached('lf' + i % 4, () => makeSilhouetteLeaf(i % 4)), ph: rg() * 6 });
  return { reg, th, T, gc, rects, circs, objs, canopies, pools, crystals, mini, bg };
}

/* ===== Gameplay: arcane arena (MOBA-style controls, waves, boss) ===== */
const BTN = {
  atk: { x: 428, y: 224, r: 22, k: 'J' }, s1: { x: 380, y: 246, r: 15, k: 'K' }, s2: { x: 390, y: 206, r: 15, k: 'L' },
  ult: { x: 432, y: 174, r: 15, k: 'U' }, pause: { x: 466, y: 16, r: 10 },
};
const ET = {
  wisp: { hp: 36, spd: 54, dmg: 10, r: 6, hh: 10, xp: 8, hover: 5 },
  imp: { hp: 80, spd: 38, dmg: 13, r: 7, hh: 10, xp: 15, hover: 0 },
  golem: { hp: 340, spd: 23, dmg: 26, r: 11, hh: 16, xp: 45, hover: 0, kb: 0.25 },
  boss: { hp: 2600, spd: 27, dmg: 22, r: 17, hh: 28, xp: 400, hover: 0, kb: 0.05 },
};
const SKILL_CD = { s1: 6, s2: 4, ult: 26 };

const Game = {
  enter(rid) {
    const p = profile(); this.p = p; this.rid = rid; this.w = buildWorld(rid); this.reg = this.w.reg; this.th = this.w.th; this.T = this.w.T;
    const st = heroStats(p); this.dm = ({ STORY: { hp: 0.85, dmg: 0.7 }, NORMAL: { hp: 1, dmg: 1 }, HARD: { hp: 1.25, dmg: 1.3 } })[p.diff] || { hp: 1, dmg: 1 };
    this.h = { x: ISLE.cx, y: ISLE.cy + 6, r: 5, dir: 'up', step: 0, stT: 0, hp: st.hp, max: st.hp, atk: st.atk, spd: st.spd, cdr: st.cdr, lvl: p.level, xp: p.xp, inv: 0, dash: 0, moving: false, dead: false, deadT: 0, cd: { atk: 0, s1: 0, s2: 0, ult: 8 } };
    this.en = []; this.shots = []; this.ebul = []; this.parts = []; this.floats = []; this.picks = []; this.fx = [];
    this.run = { kills: 0, gold: 0, gems: 0, time: 0, bossKills: 0, wave: 0, waveDone: 0 };
    this.cam = { x: clamp(this.h.x - W / 2, 0, WW - W), y: clamp(this.h.y - H / 2 + 10, 0, WH - H) }; this.shake = 0; this.t = 0;
    this.paused = false; this.pset = false; this.stick = { on: false, ox: 62, oy: 214, x: 62, y: 214 }; this.hitStop = 0;
    this.bossKilled = false; this.ending = 0; this.banner = null; this.boss = null; this.tutT = p.tut ? 9 : 0; this.lvlFlash = 0;
    this.amb = []; for (let i = 0; i < 46; i++) this.amb.push({ x: rr(0, W), y: rr(0, H), v: rr(6, 24), s: Math.random() });
    this.startWave(1); audio.music('battle');
    document.addEventListener('visibilitychange', this._vis = () => { if (document.hidden && cur === Game && !this.ending) this.paused = true; });
  },
  exit() { document.removeEventListener('visibilitychange', this._vis); audio.music('menu'); },
  hpMul() { return (0.5 + 0.025 * this.h.lvl) * (1 + 0.28 * (this.run.wave - 1)) * this.reg.mult * this.dm.hp; },
  dmgMul() { return (0.6 + 0.02 * this.h.lvl) * (1 + 0.07 * (this.run.wave - 1)) * this.reg.mult * this.dm.dmg; },

  startWave(n) {
    this.run.wave = n; this.state = 'banner'; this.stT = 2.4; const q = [], add = (t, c) => { for (let i = 0; i < c; i++) q.push(t); };
    if (n === 1) add('wisp', 8); else if (n === 2) { add('wisp', 8); add('imp', 4); } else if (n === 3) { add('wisp', 10); add('imp', 5); add('golem', 1); }
    else if (n === 4) { add('wisp', 12); add('imp', 6); add('golem', 2); } else add('wisp', 8);
    for (let i = q.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
    if (n === 5) q.unshift('boss'); this.queue = q; this.spawnT = 0.5;
    this.banner = { t: 2.4, text: n === 5 ? 'BOSS WAVE' : 'WAVE ' + n, sub: n === 5 ? 'THE VOID WARDEN AWAKENS' : this.reg.name };
    audio.sfx(n === 5 ? 'boss' : 'wave');
  },
  spawn(type) {
    const d = ET[type], h = this.h; let x = 0, y = 0, ok = false;
    if (type === 'boss') { x = ISLE.cx; y = ISLE.cy - 100; for (let i = 0; i < 40 && !spawnFree(this.w, x, y, d.r + 3); i++) { x = ISLE.cx + rr(-60, 60); y = ISLE.cy + rr(-110, -40); } ok = true; }
    else for (let i = 0; i < 60; i++) { const a = Math.random() * TAU, dd = rr(150, 240); x = h.x + Math.cos(a) * dd; y = h.y + Math.sin(a) * dd * 0.8; if (spawnFree(this.w, x, y, d.r + 3)) { ok = true; break; } }
    if (!ok) { for (let i = 0; i < 200; i++) { x = rr(80, WW - 80); y = rr(80, WH - 100); if (spawnFree(this.w, x, y, d.r + 3) && dist(x, y, h.x, h.y) > 100) { ok = true; break; } } }
    if (!ok) { x = ISLE.cx + 80; y = ISLE.cy; }
    const hp = Math.round(d.hp * this.hpMul());
    const e = { t: type, x, y, hp, max: hp, r: d.r, hh: d.hh, spd: d.spd * (1 + (this.run.wave - 1) * 0.04), dmg: d.dmg * this.dmgMul(), cd: 0, ft: 0, kx: 0, ky: 0, ph: Math.random() * 6, sh: rr(1, 2.4), anim: 0, bt: 2.2, st: 5, ring: 0, spawnT: 0.5, dead: false };
    this.en.push(e); if (type === 'boss') { this.boss = e; this.shake = 8; }
    for (let i = 0; i < 6; i++) this.burst(x, y - 4, 1, [this.T.glow, '#fff'], 40, 0.4, 2);
  },

  burst(x, y, n, cols, spd, life, size, grav) {
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = rr(0.3, 1) * spd; this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (grav ? 20 : 0), life: rr(0.5, 1) * life, max: life, col: pick(cols), s: size || 1, g: grav || 0 }); }
  },
  floatTxt(x, y, txt, col) { this.floats.push({ x, y, txt, col, t: 0.8 }); },
  moveE(e, dx, dy) {
    const w = this.w; if (blockedW(w, e.x, e.y, e.r)) this.unstick(e);
    let moved = false, nx = e.x + dx; if (!blockedW(w, nx, e.y, e.r)) { e.x = nx; moved = true; }
    const ny = e.y + dy; if (!blockedW(w, e.x, ny, e.r)) { e.y = ny; moved = true; } return moved;
  },
  unstick(e) { const w = this.w; for (let rad = 2; rad < 60; rad += 2) for (let a = 0; a < TAU; a += 0.5) { const nx = e.x + Math.cos(a) * rad, ny = e.y + Math.sin(a) * rad; if (!blockedW(w, nx, ny, e.r)) { e.x = nx; e.y = ny; return; } } },
  nearest(x, y, range) { let b = null, bd = range; for (const e of this.en) { if (e.dead || e.spawnT > 0) continue; const d = dist(x, y, e.x, e.y); if (d < bd) { bd = d; b = e; } } return b; },
  hitsObs(x, y, r) { const w = this.w; for (const o of w.rects) { const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h); if ((x - cx) ** 2 + (y - cy) ** 2 < r * r) return true; } for (const o of w.circs) if ((x - o.x) ** 2 + (y - o.y) ** 2 < (o.r + r) ** 2) return true; return false; },

  attack() {
    const h = this.h; if (h.cd.atk > 0) return; h.cd.atk = 0.34;
    const t = this.nearest(h.x, h.y, 175); let dx = 0, dy = -1;
    if (t) { dx = t.x - h.x; dy = (t.y - t.hh) - (h.y - 8); } else { dx = { left: -1, right: 1, up: 0, down: 0 }[h.dir]; dy = { up: -1, down: 1, left: 0, right: 0 }[h.dir]; }
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l; const crit = Math.random() < 0.12;
    this.shots.push({ x: h.x + dx * 6, y: h.y - 8 + dy * 4, vx: dx * 240, vy: dy * 240, r: 3, dmg: h.atk * rr(0.92, 1.08) * (crit ? 1.8 : 1), crit, life: 0.9, tr: 0 });
    audio.sfx('shoot');
  },
  nova() {
    const h = this.h; if (h.cd.s1 > 0) return; h.cd.s1 = SKILL_CD.s1 * (1 - h.cdr / 100); audio.sfx('nova');
    this.fx.push({ k: 'ring', x: h.x, y: h.y - 2, r0: 6, r1: 62, t: 0, max: 0.45, col: this.T.glow }); this.fx.push({ k: 'ring', x: h.x, y: h.y - 2, r0: 2, r1: 40, t: 0, max: 0.35, col: '#fff' });
    this.burst(h.x, h.y - 6, 26, [this.T.glow, '#fff', '#ffd27a'], 120, 0.5, 2); this.shake = Math.max(this.shake, 3);
    for (const e of this.en) { if (e.dead) continue; const d = dist(h.x, h.y, e.x, e.y); if (d < 62 + e.r) { const a = Math.atan2(e.y - h.y, e.x - h.x); this.hurtEnemy(e, h.atk * 2.4, Math.cos(a) * 150, Math.sin(a) * 150, false); } }
    for (let i = this.ebul.length - 1; i >= 0; i--) if (dist(h.x, h.y - 8, this.ebul[i].x, this.ebul[i].y) < 62) { this.burst(this.ebul[i].x, this.ebul[i].y, 3, ['#fff', '#ffd27a'], 30, 0.3); this.ebul.splice(i, 1); }
  },
  blink(mx, my) {
    const h = this.h; if (h.cd.s2 > 0) return; h.cd.s2 = SKILL_CD.s2 * (1 - h.cdr / 100);
    let dx = mx, dy = my; if (Math.hypot(dx, dy) < 0.1) { const t = this.nearest(h.x, h.y, 140); if (t) { dx = h.x - t.x; dy = h.y - t.y; } else { dx = { left: -1, right: 1, up: 0, down: 0 }[h.dir]; dy = { up: -1, down: 1, left: 0, right: 0 }[h.dir]; } }
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    for (let i = 0; i < 18; i++) { const nx = h.x + dx * 4, ny = h.y + dy * 4; if (blockedW(this.w, nx, ny, h.r)) break; this.fx.push({ k: 'ghost', x: h.x, y: h.y, dir: h.dir, step: h.step, t: 0, max: 0.35 }); h.x = nx; h.y = ny; }
    h.inv = Math.max(h.inv, 0.35); audio.sfx('dash'); this.burst(h.x, h.y - 6, 14, [this.T.glow, '#fff'], 70, 0.35, 2);
  },
  ult() {
    const h = this.h; if (h.cd.ult > 0) return; h.cd.ult = SKILL_CD.ult * (1 - h.cdr / 100); audio.sfx('ult'); this.shake = Math.max(this.shake, 4);
    const targets = this.en.filter(e => !e.dead && dist(e.x, e.y, h.x, h.y) < 230).sort((a, b) => dist(a.x, a.y, h.x, h.y) - dist(b.x, b.y, h.x, h.y));
    for (let i = 0; i < 10; i++) { let x, y; const t = targets[i % Math.max(1, targets.length)]; if (t) { x = t.x + rr(-10, 10); y = t.y + rr(-6, 6); } else { x = h.x + rr(-90, 90); y = h.y + rr(-60, 60); } if (!inIsle(x, y, 8)) { x = h.x; y = h.y - 30; } this.fx.push({ k: 'meteor', x, y, t: -i * 0.12, fall: 0.5, done: false }); }
    this.fx.push({ k: 'ring', x: h.x, y: h.y - 2, r0: 4, r1: 30, t: 0, max: 0.6, col: '#ffd27a' });
  },
  hurtHero(dmg, kx, ky) {
    const h = this.h; if (h.inv > 0 || h.dead) return; h.hp -= dmg; h.inv = 0.7; this.shake = Math.max(this.shake, 5); audio.sfx('hurt');
    this.floatTxt(h.x, h.y - 30, Math.round(dmg), '#ff6a8a'); this.burst(h.x, h.y - 10, 8, ['#ff4a6a', '#fff'], 60, 0.4, 2);
    if (kx) this.moveE(h, kx * 0.05, ky * 0.05);
